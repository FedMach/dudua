<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Question Card</title>

    <style>
      body {
        margin: 0;
        height: 100vh;
        background-color: pink;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
      }

      .card {
        background-color: white;
        width: 800px;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        text-align: center;
        position: relative;
      }

      .card img {
        width: 250px;
        max-height: 250px;
        object-fit: fill;
        border-radius: 10px;
      }

      .question {
        font-size: 20px;
        margin: 20px 0;
      }

      .buttons {
        display: flex;
        justify-content: center;
        gap: 20px;
        position: relative;
      }

      button {
        padding: 10px 25px;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
        position: relative;
      }

      .yes {
        background-color: #f8b4e7;
        color: rgb(250, 250, 250);
      }

      .no {
        background-color: #c6190c;
        color: white;
      }
    </style>
  </head>

  <body>
    <div class="card">
      <img src="Do you.png" alt="Centered Image" />

      <div class="question">Dudua, Please answer the question above ...</div>

      <div class="buttons">
        <button class="yes">Yes</button>
        <button class="no" id="noBtn">Maha2ah</button>
      </div>
    </div>

    <script>
      const noBtn = document.getElementById("noBtn");
      const yesBtn = document.querySelector(".yes");
      const questionText = document.querySelector(".question");
      const image = document.querySelector(".card img");

      let initialized = false;

      // --- NO BUTTON MOVEMENT ---
      noBtn.addEventListener("mouseenter", () => {
        // First hover → lock current position so layout doesn't break
        if (!initialized) {
          const rect = noBtn.getBoundingClientRect();
          noBtn.style.position = "fixed";
          noBtn.style.left = rect.left + "px";
          noBtn.style.top = rect.top + "px";
          initialized = true;
        }

        const btnWidth = noBtn.offsetWidth;
        const btnHeight = noBtn.offsetHeight;

        const randomX = Math.random() * (window.innerWidth - btnWidth);
        const randomY = Math.random() * (window.innerHeight - btnHeight);

        noBtn.style.left = randomX + "px";
        noBtn.style.top = randomY + "px";
      });

      // --- YES BUTTON ---
      yesBtn.addEventListener("click", () => {
        image.src = "dudu-fudu.jpeg";
        questionText.textContent = "Yaaay! You chose Yes ❤️. I love you Dudua!";
      });
    </script>
  </body>
</html>
